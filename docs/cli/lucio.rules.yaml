rules:

  # replace strings like
  # "hwUuid": "6f05 ... 8d37",
  # with
  # "hwUuid": "<REDACTED>",
  - id: redact_volumio_hwUuid
    type: re
    streams:
      - include
      - stderr
      - stdout
    target: '"hwUuid": "[0-9a-f]*",$'
    replacement: '"hwUuid": "<REDACTED>",'
    count: all
    mode: multiline
    case: respect

  # replace UUID4 strings like
  # "id": "d08f41df-c0d9-4b14-8e34-4d656ac203ec",
  # with
  # "id": "<REDACTED>",
  - id: redact_volumio_id
    type: re
    streams:
      - include
      - stderr
      - stdout
    target: '"id": "[0-9a-f\-]*",$'
    replacement: '"id": "<REDACTED>",'
    count: all
    mode: multiline
    case: respect

  # replace lines composed by URLs starting with:
  # https://static.qobuz.com
  # with
  # <REDACTED URL>
  - id: redact_qobuz_url_1
    type: re
    streams:
      - include
      - stderr
      - stdout
    target: '^https://static.qobuz.com/.*$'
    replacement: '<REDACTED URL>'
    count: all
    mode: multiline
    case: respect

  # replace lines composed by URLs starting with:
  # https://streaming-qobuz-std.akamaized.net/
  # with
  # <REDACTED URL>
  - id: redact_qobuz_url_2
    type: re
    streams:
      - include
      - stderr
      - stdout
    target: '^https://streaming-qobuz-std.akamaized.net/.*$'
    replacement: '<REDACTED URL>'
    count: all
    mode: multiline
    case: respect

  # replace /home/alberto/ with /home/user/
  - id: redact_home_directory
    type: str
    streams:
      - include
      - stderr
      - stdout
    target: "/home/alberto/"
    replacement: "/home/user/"
    count: all
    mode: multiline
    case: respect

